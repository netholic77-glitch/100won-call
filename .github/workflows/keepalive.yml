name: Supabase keepalive

# 무료 Supabase 프로젝트는 약 7일 동안 요청이 없으면 자동으로 일시정지(INACTIVE)된다.
# 그러면 도메인이 내려가(NXDOMAIN) 보호자 실시간 위치공유(track.html)가 갑자기
# "연결 중…"에서 멈춘다. 며칠마다 가벼운 요청을 보내 '활성' 상태를 유지해 예방한다.
# anon 키는 이미 공개된 공개 키(rt-config.js)라 별도 GitHub Secret이 필요 없다.

on:
  schedule:
    - cron: "23 20 */3 * *"   # 3일마다 1회 (UTC 20:23 ≈ KST 05:23) — 7일 정지선 대비 넉넉
  workflow_dispatch:           # 필요하면 Actions 탭에서 수동 실행

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (keep project active)
        env:
          BASE: "https://siqlhoimzvklzzhrqayq.supabase.co"
          ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcWxob2ltenZrbHp6aHJxYXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODA1MzUsImV4cCI6MjA5NTk1NjUzNX0.BwvIE-FBUM_tfe1obuUtmIl7IzjWcYm_lEGNzJbk_b8"
        run: |
          set -u
          health=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $ANON" "$BASE/auth/v1/health" || echo 000)
          echo "auth/v1/health -> $health"
          # REST 게이트웨이도 한 번 더 두드려 서비스 활성 신호를 다양화(코드는 참고용).
          rest=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $ANON" "$BASE/rest/v1/" || echo 000)
          echo "rest/v1 -> $rest"
          if [ "$health" != "200" ]; then
            echo "::error::Supabase health가 200이 아닙니다($health). 프로젝트가 멈췄을 수 있어요 — Supabase 대시보드에서 Restore 하세요."
            exit 1
          fi
          echo "OK — Supabase 프로젝트 활성 유지됨."
